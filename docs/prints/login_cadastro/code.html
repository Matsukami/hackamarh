<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GAIA - Login / Cadastro</title>

    />
    <script id="tailwind-config">

            colors: {

              'on-tertiary-fixed-variant': '#3f4c00',

              'inverse-primary': '#a0d1bc',

              error: '#ba1a1a',

              'inverse-surface': '#32302b',
              'on-error-container': '#93000a',
              primary: '#00261b',

              background: '#fef9f1',

              'surface-container-highest': '#e7e2da',
              'on-tertiary-container': '#92a831',
              'secondary-container': '#a5f3c9',
              'on-primary': '#ffffff',
              'on-tertiary-fixed': '#181e00',
              'tertiary-fixed-dim': '#bad156',
              'tertiary-fixed': '#d5ee6f',
              'surface-dim': '#ded9d2',
              'on-tertiary': '#ffffff',
              'on-background': '#1d1c17',
              'on-secondary-fixed-variant': '#005235',
              'inverse-on-surface': '#f5f0e8',
              'on-primary-fixed': '#002116',
              'secondary-fixed': '#a5f3c9',
              outline: '#717974',
              'surface-container-lowest': '#ffffff',
              'on-surface-variant': '#414944',
              'tertiary-container': '#303a00',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            spacing: {
              'margin-mobile': '16px',
              unit: '8px',
              'container-max': '1280px',
              gutter: '24px',
              'margin-desktop': '40px',
            },
            fontFamily: {
              'display-lg': ['Sora'],
              'body-md': ['DM Sans'],
              'body-lg': ['DM Sans'],
              'headline-sm': ['Sora'],
              'label-md': ['DM Sans'],
              'headline-lg': ['Sora'],
              'headline-lg-mobile': ['Sora'],
              'headline-md': ['Sora'],
              'label-sm': ['DM Sans'],
            },
            fontSize: {
              'display-lg': [
                '48px',

              ],

              ],

              ],
              'headline-md': [
                '24px',

              ],
              'label-sm': [
                '11px',

                  lineHeight: '16px',

                },
              ],
            },
          },
        },
      };

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface font-body-md flex h-screen flex-col antialiased md:flex-row"
  >
    <!-- Image Canvas (Hidden on mobile) -->
    <div class="relative hidden h-full w-1/2 md:block">
      <img
        alt="Cerrado Landscape"
        class="h-full w-full object-cover"
        data-alt="A lush, expansive aerial view of the Brazilian Cerrado at golden hour. The landscape features organic, flowing rivers cutting through vibrant green vegetation and rich, textured soil. The lighting is warm and dramatic, casting long shadows that highlight the natural contours of the earth. The overall aesthetic is grounded, organic, and ecologically vibrant, aligning perfectly with a modern institutional climate fund's visual identity."
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaw1FSyU1QhkEokZmXDAdwbFNW517ak3gVpQWuN-yQDpJvZ9vgCuvJ8WbVoXII1qlB0eWf4yxxSmkHKf7MrPYKyUviSfjXXANBzHLL7LVp3Ht7qzLZPyVrNg8xH61sq0ewMRvIEEAVt90wDOcA-PVpnaGy0Q_DIjP6KLYJUzfJxg7flDrMJppIZyPyD7meITz1cCRDS31dgGZXGIx1htYqxADHsAbMHPr-5TvKVBYl6M_T_-srvC7-1lm_y9Ahl6agUARJKKaGWf-9"
      />
      <div class="bg-primary/20 pointer-events-none absolute inset-0 mix-blend-multiply"></div>
    </div>
    <!-- Login/Cadastro Canvas -->
    <div
      class="px-margin-mobile md:px-margin-desktop bg-inverse-on-surface flex h-full w-full flex-col justify-center overflow-y-auto py-8 md:w-1/2 md:py-16"
    >
      <div class="mx-auto w-full max-w-md">
        <!-- Brand Anchor -->
        <div class="mb-12 text-center md:text-left">
          <h1 class="text-display-lg font-display-lg text-secondary">GAIA</h1>
          <p class="text-body-md font-body-md text-on-surface-variant mt-2">
            Plataforma de Gestão do Fundo Climático
          </p>
        </div>
        <!-- Tabs -->
        <div class="border-outline-variant mb-8 flex border-b" role="tablist">
          <button
            aria-selected="true"
            class="border-secondary text-secondary font-label-md text-label-md flex-1 border-b-2 py-3 text-center transition-colors"
            id="tab-entrar"
            onclick="switchTab('entrar')"
            role="tab"
          >
            Entrar
          </button>
          <button
            aria-selected="false"
            class="text-on-surface-variant font-label-md text-label-md hover:text-on-surface flex-1 border-b-2 border-transparent py-3 text-center transition-colors"
            id="tab-criar"
            onclick="switchTab('criar')"
            role="tab"
          >
            Criar Conta
          </button>
        </div>
        <!-- Form: Entrar -->
        <form class="block space-y-6" id="form-entrar">
          <div>
            <label
              class="text-label-sm font-label-sm text-on-surface-variant mb-2 block"
              for="login-email"
              >E-mail</label
            >
            <input
              class="bg-surface border-outline-variant text-body-md focus:border-secondary focus:ring-secondary w-full rounded-xl border px-4 py-3 outline-none transition-all focus:ring-1"
              id="login-email"
              placeholder="seu@email.com"
              type="email"
            />
          </div>
          <div>
            <div class="mb-2 flex items-center justify-between">
              <label
                class="text-label-sm font-label-sm text-on-surface-variant block"
                for="login-senha"
                >Senha</label
              >
              <a class="text-label-sm font-label-sm text-secondary hover:underline" href="#"
                >Esqueceu a senha?</a
              >
            </div>
            <input
              class="bg-surface border-outline-variant text-body-md focus:border-secondary focus:ring-secondary w-full rounded-xl border px-4 py-3 outline-none transition-all focus:ring-1"
              id="login-senha"
              placeholder="••••••••"
              type="password"
            />
          </div>
          <button
            class="bg-secondary hover:bg-surface-tint text-on-secondary text-label-md font-label-md mt-8 flex w-full items-center justify-center gap-2 rounded-xl py-3 shadow-sm transition-all hover:shadow-md"
            type="submit"
          >
            Entrar <span class="material-symbols-outlined" data-icon="login">login</span>
          </button>
        </form>
        <!-- Form: Criar Conta -->
        <form class="hidden space-y-6" id="form-criar">
          <div>
            <label
              class="text-label-sm font-label-sm text-on-surface-variant mb-2 block"
              for="cad-nome"
              >Nome Completo</label
            >
            <input
              class="bg-surface border-outline-variant text-body-md focus:border-secondary focus:ring-secondary w-full rounded-xl border px-4 py-3 outline-none transition-all focus:ring-1"
              id="cad-nome"
              placeholder="Seu nome"
              type="text"
            />
          </div>
          <div>
            <label
              class="text-label-sm font-label-sm text-on-surface-variant mb-2 block"
              for="cad-email"
              >E-mail</label
            >
            <input
              class="bg-surface border-outline-variant text-body-md focus:border-secondary focus:ring-secondary w-full rounded-xl border px-4 py-3 outline-none transition-all focus:ring-1"
              id="cad-email"
              placeholder="seu@email.com"
              type="email"
            />
          </div>
          <div>
            <label
              class="text-label-sm font-label-sm text-on-surface-variant mb-2 block"
              for="cad-senha"
              >Senha</label
            >
            <input
              class="bg-surface border-outline-variant text-body-md focus:border-secondary focus:ring-secondary w-full rounded-xl border px-4 py-3 outline-none transition-all focus:ring-1"
              id="cad-senha"
              placeholder="Mínimo 8 caracteres"
              type="password"
            />
          </div>
          <button
            class="bg-secondary hover:bg-surface-tint text-on-secondary text-label-md font-label-md mt-8 flex w-full items-center justify-center gap-2 rounded-xl py-3 shadow-sm transition-all hover:shadow-md"
            type="submit"
          >
            Cadastrar
            <span class="material-symbols-outlined" data-icon="person_add">person_add</span>
          </button>
          <p class="text-label-sm font-label-sm text-on-surface-variant mt-4 text-center">
            Ao criar uma conta, você concorda com os
            <a class="text-secondary underline" href="#">Termos de Serviço</a> e
            <a class="text-secondary underline" href="#">Política de Privacidade</a>.
          </p>
        </form>
      </div>
    </div>
    <script>
      function switchTab(tab) {
        const btnEntrar = document.getElementById('tab-entrar');
        const btnCriar = document.getElementById('tab-criar');
        const formEntrar = document.getElementById('form-entrar');
        const formCriar = document.getElementById('form-criar');

        if (tab === 'entrar') {
          btnEntrar.classList.add('border-secondary', 'text-secondary');
          btnEntrar.classList.remove('border-transparent', 'text-on-surface-variant');
          btnCriar.classList.remove('border-secondary', 'text-secondary');
          btnCriar.classList.add('border-transparent', 'text-on-surface-variant');

          formEntrar.classList.remove('hidden');
          formEntrar.classList.add('block');
          formCriar.classList.add('hidden');
          formCriar.classList.remove('block');
        } else {
          btnCriar.classList.add('border-secondary', 'text-secondary');
          btnCriar.classList.remove('border-transparent', 'text-on-surface-variant');
          btnEntrar.classList.remove('border-secondary', 'text-secondary');
          btnEntrar.classList.add('border-transparent', 'text-on-surface-variant');

          formCriar.classList.remove('hidden');
          formCriar.classList.add('block');
          formEntrar.classList.add('hidden');
          formEntrar.classList.remove('block');
        }
      }
    </script>
  </body>
</html>
